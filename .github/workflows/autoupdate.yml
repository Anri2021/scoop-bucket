name: Meta-Bucket Auto Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  pull_request:
    paths:
      - "recipes.json"
      - "scripts/generate-bucket.ps1"
      - ".github/workflows/autoupdate.yml"

concurrency:
  group: meta-bucket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate recipes and release discovery
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/generate-bucket.ps1 -RecipesPath ./recipes.json -ValidateOnly

  smoke-build:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Python builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Build every package without publishing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/generate-bucket.ps1 -RecipesPath ./recipes.json -BucketDir ./bucket -BuildDir ./dist -NoPublish -ForceRebuild

  build-and-sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source and toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            dist/cache
            dist/toolchain
          key: meta-bucket-${{ runner.os }}-${{ hashFiles('recipes.json') }}
          restore-keys: |
            meta-bucket-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install reusable Python builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Generate, build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/generate-bucket.ps1 -RecipesPath ./recipes.json -BucketDir ./bucket -BuildDir ./dist

      - name: Commit deterministic manifests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all bucket recipes.lock.json
          if (git diff --staged --quiet) {
            Write-Host "No manifest changes."
            exit 0
          }
          git commit -m "chore(bucket): synchronize manifests"
          git pull --rebase origin main
          git push origin HEAD:main
