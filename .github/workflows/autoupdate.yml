name: Meta-Bucket Auto Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # בדיקה וסנכרון שעתית

jobs:
  build-and-sync:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Build Tools
        run: pip install --upgrade pyinstaller

      - name: Run Meta-Bucket Generator
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # הרצת מנוע האוטומציה מול קובץ התצורות המרכזי
          & "./scripts/generate-bucket.ps1" -RecipesPath "recipes.json" -BucketDir "bucket"

          # סנכרון ושמירה חזרה למאגר ב-GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/ recipes.json
          if (-not (git diff --staged --quiet)) {
              git commit -m "Auto-generate manifests and sync releases via Meta-Bucket"
              git pull --rebase origin main
              git push origin main
          } else {
              Write-Host "No changes detected. Bucket manifests are fully up to date."
          }
          
