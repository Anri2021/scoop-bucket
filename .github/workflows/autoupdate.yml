name: Meta-Bucket v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "recipes.json"
      - "scripts/**"
      - "schemas/**"
      - ".github/workflows/autoupdate.yml"
  schedule:
    - cron: "0 * * * *"
  pull_request:
    paths:
      - "recipes.json"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/autoupdate.yml"

concurrency:
  group: meta-bucket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test schema, dependency graph and generated manifests
        shell: pwsh
        run: ./tests/test-engine.ps1

  plan:
    needs: contract-tests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_build: ${{ steps.matrix.outputs.has_build }}
      needs_python: ${{ steps.matrix.outputs.needs_python }}
      needs_node: ${{ steps.matrix.outputs.needs_node }}
      needs_go: ${{ steps.matrix.outputs.needs_go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve versions and deterministic decisions
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/generate-bucket.ps1 -Phase Plan -RecipesPath ./recipes.json -PlanPath ./dist/plan.json
      - name: Export required builders
        id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content ./dist/plan.json -Raw | ConvertFrom-Json
          $builds = @($plan.packages | Where-Object needs_build)
          $types = @($builds | ForEach-Object { $_.recipe.build_type })
          "has_build=$($builds.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "needs_python=$($types -contains 'python' -or $types -contains 'auto')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "needs_node=$($types -contains 'node' -or $types -contains 'auto')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "needs_go=$($types -contains 'go' -or $types -contains 'auto')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-plan-${{ github.run_id }}
          path: dist/plan.json
          if-no-files-found: error
          retention-days: 1

  build:
    if: needs.plan.outputs.has_build == 'true'
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-plan-${{ github.run_id }}
          path: dist
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            dist/cache
            dist/toolchain
          key: meta-v3-${{ runner.os }}-${{ hashFiles('recipes.json') }}
          restore-keys: |
            meta-v3-${{ runner.os }}-
      - if: needs.plan.outputs.needs_python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - if: needs.plan.outputs.needs_node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - if: needs.plan.outputs.needs_go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - if: needs.plan.outputs.needs_python == 'true'
        name: Install Python cloud builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --upgrade pyinstaller
      - name: Build untrusted sources without a write token
        shell: pwsh
        run: ./scripts/generate-bucket.ps1 -Phase Build -RecipesPath ./recipes.json -PlanPath ./dist/plan.json -StageDir ./dist/stage -CacheDir ./dist/cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-stage-${{ github.run_id }}
          path: dist/stage
          if-no-files-found: error
          retention-days: 1

  verify:
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [ plan, build ]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-plan-${{ github.run_id }}
          path: dist
      - if: needs.build.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-stage-${{ github.run_id }}
          path: dist/stage
      - name: Generate manifests without publishing
        shell: pwsh
        run: ./scripts/generate-bucket.ps1 -Phase Finalize -NoPublish -RecipesPath ./recipes.json -PlanPath ./dist/plan.json -StageDir ./dist/stage -BucketDir ./bucket
      - name: Validate generated JSON
        shell: pwsh
        run: |
          Get-ChildItem ./bucket/*.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

  publish:
    if: always() && github.event_name != 'pull_request' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [ plan, build ]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-plan-${{ github.run_id }}
          path: dist
      - if: needs.build.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-stage-${{ github.run_id }}
          path: dist/stage
      - name: Publish trusted artifacts and generate manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/generate-bucket.ps1 -Phase Finalize -RecipesPath ./recipes.json -PlanPath ./dist/plan.json -StageDir ./dist/stage -BucketDir ./bucket
      - name: Commit only deterministic changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all bucket recipes.lock.json
          if (git diff --staged --quiet) {
            Write-Host "No deterministic changes."
            exit 0
          }
          git commit -m "chore(bucket): synchronize deterministic manifests"
          git pull --rebase origin main
          git push origin HEAD:main
